server:
  port: 8083

spring:
  application:
    name: book-service
  datasource:
    url: jdbc:mysql://localhost:3306/ebook_book?useSSL=false&allowPublicKeyRetrieval=true&serverTimezone=UTC
    username: book_service
    password: BookSvc#123
    driver-class-name: com.mysql.cj.jdbc.Driver
  jpa:
    hibernate:
      ddl-auto: validate
    show-sql: false
    properties:
      hibernate:
        format_sql: true
  flyway:
    enabled: true
    locations: classpath:db/migration

eureka:
  client:
    service-url:
      defaultZone: http://localhost:8761/eureka/
    register-with-eureka: true
    fetch-registry: true

jwt:
  secret: change-me-super-secret-key-for-book-service

management:
  endpoints:
    web:
      exposure:
        include: health,info
